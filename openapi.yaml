  /v1/news/archive:
    get:
      summary: News archive (paginated)
      description: The WHOLE retained news archive, not just the recent window that /v1/news/general serves.
        Cursor-paginated (keyset on ts+id, stable while new rows arrive at the head), date-rangeable and
        keyword-searchable. Unlike /v1/news/general this includes TRUMP_POLICY by default. Page size is
        capped server-side at 200. Every empty response carries a `status` (ok | no_match | before_coverage
        | after_coverage | no_records_yet) and an `empty_reason`, so a range that predates our records
        is distinguishable from a filter that matched nothing. The item array is under the key `events`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Rate limit exceeded
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      parameters:
      - name: limit
        in: query
        description: Page size, 1-200.
        schema:
          type: integer
          default: 50
      - name: cursor
        in: query
        description: Opaque keyset cursor '<ts>_<id>' from `next_cursor` of the previous page.
        schema:
          type: string
      - name: offset
        in: query
        description: Alternative to cursor for random access.
        schema:
          type: integer
          default: 0
      - name: start
        in: query
        description: Inclusive start, YYYY-MM-DD or unix seconds.
        schema:
          type: string
      - name: end
        in: query
        description: Exclusive end, YYYY-MM-DD or unix seconds.
        schema:
          type: string
      - name: date
        in: query
        description: Sugar for one whole UTC day, YYYY-MM-DD.
        schema:
          type: string
      - name: category
        in: query
        description: One of TRUMP_POLICY, WAR_GEOPOLITICAL, CRYPTO_REGULATORY, MARKET_SHOCK, FED_MONETARY,
          CRYPTO_GENERAL.
        schema:
          type: string
      - name: source
        in: query
        description: Publisher name, e.g. Reuters.
        schema:
          type: string
      - name: q
        in: query
        description: Keyword search over headline and summary; multiple terms are ANDed.
        schema:
          type: string
      - name: include_trump
        in: query
        description: Set 0 to exclude TRUMP_POLICY. Default 1.
        schema:
          type: integer
          default: 1
