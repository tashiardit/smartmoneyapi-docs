                    properties:
                      source_timestamp:
                        type: integer
                        nullable: true
                      received_at:
                        type: integer
                        nullable: true
                      staleness_s:
                        type: integer
                        nullable: true
                      stale_after_s:
                        type: integer
                        nullable: true
                      coverage_status:
                        type: string
                        enum:
