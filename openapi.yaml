                        type: integer
                      symbols:
                        type: array
                      venues:
                        type: array
                      meaning:
                        type: string
                  observed:
                    type: object
                    description: Per-venue earliest/latest ts and row count for the live (non-backfilled)
                      derivatives table in THIS shard -- the daemon rotates the database, so earliest_ts_in_this_shard
                      is a floor on collection start, not when collection began.
