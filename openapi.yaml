  /v1/liquidations:
    get:
      summary: Liquidation levels (modelled) + realized tape
      description: |-
        Two different things in one payload. (1) A MODELLED ladder of where leveraged positions would liquidate, built from measured open interest, an average leverage inferred from funding, and the liquidation prices of tracked Hyperliquid wallets. (2) `realized_heatmap` — what actually liquidated, from the live CEX tapes (Binance, OKX, Bybit, Bitget, BitMEX).

        THE MODELLED LADDER IS NOT A SET OF OBSERVED CLUSTERS. Both band sides are placed at maintenance-margin/leverage from the same entry, so when neither side has a tracked wallet level in front of the bands the two nearest distances are EQUAL BY CONSTRUCTION. `nearest_symmetric: true` says so; `nearest_basis` names the source. Two equal percentages are one number restated, not two independent readings that agree.

        NO PER-SIDE DOLLAR OPEN-INTEREST SPLIT IS INVENTED. `total_long_oi` and `total_short_oi` are null unless a venue actually reported a breakdown, and `oi_split_source` says which case you are in. For a perpetual, long and short notional are equal by identity, so a 50/50 bar is not an unmeasured quantity — it is a quantity that cannot differ. Directional skew is carried by `positioning`, which names the population behind every reading.

        READ THE STATUS FIELDS. `bands_status`, `nearest_status`, `oi_split_source`, `positioning.status` and `whale_book.status` each separate "we measured this" from "we could not". A null distance, a null funding rate and a 'unknown' cascade_risk are absences, not zeros and not calm.

        TIERS. Trader receives 26 of the 30 fields, listed per field below; the ladders are truncated to 5 levels per side (Pro: up to 10) and Pro additionally receives `nearest_status`, `nearest_excluded_modelled`, `nearest_exclusion_reason`, `realized_heatmap`. Anything a plan removed is named in `withheld` (`withheld_reason: "trader_plan"`), computed per response — so a short ladder does not report a boundary that removed nothing, and a missing key never has to stand in for both "not in your plan" and "the server had nothing".

        NOTE: `nearest_status`, `nearest_excluded_modelled`, `nearest_exclusion_reason` qualify `nearest_long_liq_pct` / `nearest_short_liq_pct`, which Trader DOES receive, and are currently Pro-only. A Trader can still separate the two empty states — both distances null with a non-empty ladder means levels exist but none was eligible to set a headline; empty ladders mean nothing was on that side — but the count and the stated reason for refused levels are not on that plan.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Every property is tagged with the tiers that receive it. Tags, ladder depths
                  and the `withheld` vocabulary are read from api_gateway._handle_liquidations and liquidation_estimator
                  at generation time, not hand-written.
                properties:
                  symbol:
                    type: string
                    description: '[Trader and Pro] Base symbol this payload describes.'
                  current_price:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] Mark price every distance below is measured from. null
                      when no usable price was readable — never 0.'
                  longs:
                    type: array
                    items:
                      type: object
                    description: '[Trader and Pro] Modelled long-liquidation ladder, nearest first. Each
                      level carries liq_price, entry_px, leverage, dist_pct, source (whale_position |
                      oi_band) and size_measured. Trader receives the first 5 per side; Pro receives up
                      to 10. The cut is taken from the FAR end, so the nearest level always matches the
                      headline distance.'
                  shorts:
                    type: array
                    items:
                      type: object
                    description: '[Trader and Pro] Modelled short-liquidation ladder, same shape and same
                      truncation rule as `longs`.'
                  cascade_risk:
                    type: string
                    enum:
                    - extreme
                    - high
                    - low
                    - moderate
                    - unknown
                    description: '[Trader and Pro] Bucket of the nearest reportable distance. ''unknown''
                      means no distance was reportable at all — read it as absent, not as calm.'
                  nearest_long_liq_pct:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] Absolute percentage distance from `current_price` to
                      the nearest long level eligible to set a headline. null when none was.'
                  nearest_short_liq_pct:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] Same on the short side. See `nearest_symmetric` before
                      comparing the two.'
                  nearest_symmetric:
                    type: boolean
                    description: '[Trader and Pro] true when BOTH nearest distances came from the open-interest
                      band ladder. The bands place each side at maintenance-margin/leverage from the same
                      entry, so the two percentages are then ONE number restated, not two located clusters.
                      Do not read equality as agreement.'
                  nearest_basis:
                    type: string
                    enum:
                    - none
                    - oi_band
                    - whale
                    description: '[Trader and Pro] Where the headline distances came from: ''oi_band''
                      (modelled ladder), ''whale'' (a tracked position), or ''none''.'
                  bands_status:
                    type: string
                    enum:
                    - no_funding_measurement
                    - no_levels
                    - ok
                    description: '[Trader and Pro] Did the band model run? ''no_funding_measurement''
                      means funding was never read, so nothing was modelled — a different question from
                      `nearest_status`, and both are needed to write one honest sentence.'
                  funding_rate:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] The only input to the inferred crowd leverage the bands
                      are built from. null means never read, not zero.'
                  total_oi:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] Measured aggregate open interest in USD. The only open-interest
                      number here that anything observed.'
                  oi_scope:
                    type: string
                    enum:
                    - sum_of_binance_bybit_hyperliquid
                    nullable: true
                    description: '[Trader and Pro] What `total_oi` is a sum over. null whenever `total_oi`
                      is null.'
                  total_long_oi:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] Long-side open interest in USD, and null unless a venue
                      actually reported a per-side breakdown. The aggregate is NEVER halved into a 50/50
                      split — for a perpetual, long and short notional are equal by identity, so a dollar
                      split is not a measurement.'
                  total_short_oi:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] Short-side open interest in USD, under the same rule
                      as `total_long_oi`.'
                  oi_split_source:
                    type: string
                    enum:
                    - aggregate_only
                    - measured
                    - unavailable
                    description: '[Trader and Pro] Why the per-side split is or is not present: ''measured''
                      (a venue reported it), ''aggregate_only'' (only the total was readable), ''unavailable''
                      (nothing was).'
                  positioning:
                    type: object
                    description: '[Trader and Pro] Directional skew, which unlike a dollar split IS measurable.
                      Carries top_trader_long_share / top_trader_lsr with top_trader_scope, the account-headcount
                      pair with its own scope, and `status` (ok | unavailable | unmeasured_default). ''unmeasured_default''
                      means the upstream ratio was a default rather than a reading, and both shares are
                      then null.'
                  whale_book:
                    type: object
                    description: '[Trader and Pro] Summary of the tracked Hyperliquid book: status, scope,
                      long_share, wallet counts, liq_price_source, as_of/age_s. No wallet identity. Trader''s
                      copy omits long_notional_usd, short_notional_usd.'
                  realized_totals:
                    type: object
                    nullable: true
                    description: '[TRADER ONLY] Trader''s view of `realized_heatmap.totals` — notional
                      and count of what actually liquidated. null when the tape had nothing.'
                  realized_by_side:
                    type: object
                    nullable: true
                    description: '[TRADER ONLY] Trader''s view of `realized_heatmap.by_side`.'
                  withheld:
                    type: array
                    items:
                      type: string
                    description: '[TRADER ONLY] Machine-readable list of what THIS response had removed
                      by plan. Vocabulary: `level_detail_beyond_5`, `realized_heatmap.matrices`, `whale_book.long_notional_usd`,
                      `whale_book.short_notional_usd`. Computed per response, so a symbol whose ladder
                      was already short reports no boundary that removed nothing.'
                  withheld_reason:
                    type: string
                    enum:
                    - trader_plan
                    description: '[TRADER ONLY] Why those entries were removed. ''trader_plan'' means
                      the plan removed them; an absent field means nothing was removed. This is how a
                      consumer tells ''your plan does not include this'' apart from ''the server had nothing'',
                      which a missing key cannot express.'
                  level_depth:
                    type: integer
                    enum:
                    - 5
                    description: '[TRADER ONLY] Levels per side in this response (5).'
                  ts:
                    type: integer
                    description: '[Trader and Pro] Unix timestamp the payload was built.'
                  price_source:
                    type: string
                    enum:
                    - none
                    - binance_ticker
                    - derivatives_snapshot
                    - binance_futures
                    - last_known
                    description: '[Trader and Pro] Where `current_price` came from, in falling recency:
                      ''binance_ticker'' (live), ''last_known'' (our own last good live read, bounded
                      at 600 s), ''derivatives_snapshot'' (median venue price from our newest collection
                      cycle, bounded at 2700 s — derived from that feed''s measured p99 of 28.8 min),
                      or ''none'' when no source answered and `current_price` is null.'
                  price_age_s:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] Seconds between that price being observed and this
                      payload being built. 0 for a live read. null when no price was readable — never
                      0, which would report an absent datum as a fresh one.'
                  nearest_status:
                    type: string
                    enum:
                    - no_exchange_reported_levels
                    - no_levels
                    - ok
                    description: '[PRO/ENTERPRISE ONLY] Whether a distance was reportable. ''no_exchange_reported_levels''
                      means levels exist and are drawn, but every candidate was modelled rather than exchange-reported
                      and so was refused as a headline; ''no_levels'' means there was nothing on that
                      side at all.'
                  nearest_excluded_modelled:
                    type: integer
                    description: '[PRO/ENTERPRISE ONLY] How many drawn levels were refused as headline
                      candidates because their liquidation price is modelled. Non-zero alongside nearest_status
                      ''ok'' is ordinary.'
                  nearest_exclusion_reason:
                    type: string
                    nullable: true
                    description: '[PRO/ENTERPRISE ONLY] The caveat those refused levels carried. null
                      when none were refused.'
                  realized_heatmap:
                    type: object
                    description: '[PRO/ENTERPRISE ONLY] The full realized tape for the last window: price
                      x time matrices, per-price clusters, per-venue counts, totals and by_side. Present
                      only when the stream has data for the symbol.'
        '429':
          description: Rate limit exceeded
        '401':
          description: Missing or invalid API key
        '402':
          description: Endpoint not included in your plan (response carries an upgrade CTA)
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      parameters:
      - name: symbol
        in: query
        description: Base symbol, e.g. BTC.
        schema:
          type: string
          default: BTC
      x-tier: Trader (3,000 calls/day)
      tags:
      - Liquidations
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      x-auth: required
      operationId: get_v1_liquidations
  /v1/liquidations/aftermath:
