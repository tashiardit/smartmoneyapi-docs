  /v1/disclosures/operator-positions:
    get:
      summary: Operator position disclosure
      description: Whether the operator's automated trading accounts currently hold a position in each
        asset -- the conflict-of-interest disclosure MiCA Art. 91(2)(c) requires next to every published
        signal, served by the SAME provider as the `operator_position_disclosure` field on /v1/confirm,
        /v1/signals/recent, /v1/signals/{signal_id}/outcome, /v1/performance, /v1/performance/export,
        /v1/alerts/regime-flips, /v1/signals/capitulation (+ walkforward), /v1/shadow-gate/decisions,
        /v1/analysis, /v1/projection (+ screener), /v1/screener (+ rankings, symbol) and /v1/rankings.
        Read from the bots' own stored state, never from an exchange. `not_holding` is asserted only from
        position data at most 900 s old; stale, missing or unreadable data answers `unavailable`, whose
        text says the accounts MAY hold a position. Keys of `disclosures` are normalised base symbols
        (BTCUSDT -> BTC), in request order. 400 on a malformed `symbols`; 503 if the provider path fails.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  disclosures:
                    type: object
                    additionalProperties:
                      type: object
                      description: 'Whether the operator''s automated trading accounts hold a position
                        in the asset (MiCA Art. 91(2)(c) conflict disclosure). A historical signal carries
                        the value recorded when it was published; one with no record is ''unavailable''.
                        Unavailable value: {"status": "unavailable", "side": null, "as_of": null, "source_age_s":
                        null, "text": "Operator position data is unavailable right now; the operator''s
                        automated trading accounts may hold a position in this asset."}.'
                      properties:
                        symbol:
                          type: string
                          description: Normalised base asset (BTCUSDT, BTC-PERP -> BTC).
                        status:
                          type: string
                          enum:
                          - holding
                          - not_holding
                          - unavailable
                          description: not_holding is asserted only from position data at most 900 s old;
                            stale, missing or unreadable data is unavailable.
                        side:
                          type: string
                          nullable: true
                          description: long, short or mixed (opposite sides across accounts) when holding
                            and the side is known. null when not holding or unavailable, and also when
                            holding while an account that is stale, stopped or unreadable may hold the
                            asset on another side (the text then says "hold a position").
                        as_of:
                          type: string
                          nullable: true
                          description: UTC time of the position data, YYYY-MM-DDTHH:MM:SSZ; null when
                            unavailable.
                        source_age_s:
                          type: integer
                          nullable: true
                          description: Age of that data in seconds when the disclosure was made; null
                            when unavailable.
                        text:
                          type: string
                          description: The sentence to show next to the signal.
                      example:
                        symbol: BTC
                        status: holding
                        side: long
                        as_of: '2026-10-01T16:00:00Z'
                        source_age_s: 42
                        text: The operator's automated trading accounts hold a long position in BTC (as
                          of 2026-10-01 16:00 UTC).
                      required:
                      - symbol
                      - status
                      - side
                      - as_of
                      - source_age_s
                      - text
                  generated_at:
                    type: string
                    description: UTC, YYYY-MM-DDTHH:MM:SSZ.
                example:
                  disclosures:
                    BTC:
                      symbol: BTC
                      status: not_holding
                      side: null
                      as_of: '2026-10-01T16:00:00Z'
                      source_age_s: 42
                      text: The operator's automated trading accounts hold no position in BTC (as of 2026-10-01
                        16:00 UTC).
                  generated_at: '2026-10-01T16:00:42Z'
        '429':
          description: Rate limit exceeded
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      parameters:
      - name: symbols
        in: query
        description: Comma-separated symbols, at most 50 (e.g. BTC,ETH,SOLUSDT).
        schema:
          type: string
        required: true
      security:
      - {}
      - ApiKeyAuth: []
      tags:
      - Signals
      x-auth: none
      x-tier: public
      x-free-tier-symbols:
      - BTC
      - ETH
      - SOL
      - XAU
      - XAG
      operationId: get_v1_disclosures_operator_positions
