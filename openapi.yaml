  /v1/funding/normalised:
    get:
      summary: Cross-venue funding on one clock
      description: 'One underlying''s live funding rate on every venue we hold a rate for, put on a single
        annualised basis using each venue''s MEASURED settlement clock (see /v1/funding/clock) instead
        of assuming every venue settles 8-hourly. Every venue that has a stored rate for this symbol lands
        in exactly one of three buckets so none can silently disappear from the average: `venues_contributing`
        (used in the mean), `venues_refused` (had a rate but the clock refused it, with a reason per venue),
        and `venues_unmapped` (no funding stored, or no single measured linear perpetual resolves for
        this base in the venue registry). `comparison` recomputes the same contributing rates assuming
        every venue is 8-hourly, so the size of the correction is checkable from the response alone (measured
        median across underlyings: 5.47 annualised percentage points). A symbol with no derivatives row
        in the last 2 hours returns `status: no_rows` rather than an empty average. `?symbol=` other than
        alphanumeric/`_`/`-` is a 400 `bad_symbol`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: On status=no_rows only status/symbol/message/venues_* are populated.
                properties:
                  status:
                    type: string
                  symbol:
                    type: string
                  base:
                    type: string
                  mean_annualised_pct:
                    type: number
                  mean_rate_8h_equivalent:
                    type: number
                  basis:
                    type: string
                  venues_contributing:
                    type: array
                  venues_refused:
                    type: object
                  venues_unmapped:
                    type: object
                  venues_with_a_stored_rate:
                    type: array
                  per_venue:
                    type: object
                  observed_ts:
                    type: integer
                  comparison:
                    type: object
                    properties:
                      mean_annualised_pct_if_every_venue_assumed_8h:
                        type: number
                      mean_annualised_pct_on_measured_clocks:
                        type: number
                      difference_pct_points:
                        type: number
                      note:
                        type: string
                  not_claimed:
                    type: array
        '429':
          description: Rate limit exceeded
