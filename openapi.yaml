      - BearerAuth: []
      tags:
      - Intelligence
      x-auth: required
      x-tier: Pro (15,000 calls/day)
      operationId: get_v1_analysis
  /v1/analysis/status:
    get:
      summary: AI analysis status
      description: 'Freshness and availability of the AI analysis loop, with the public regime teaser:
        per symbol, `regime` and `regime_label` (an opinion on the asset, e.g. "Strong bullish trend").
        `engine` is `ok`, `stale`, `warming` (just started, or generating now), `on_demand` (healthy and
        idle: readings are generated when requested, so an empty cache is normal until someone asks) or
        `unavailable` (a failed or paused run, a loop that is not reporting, or a cache that cannot be
        read; this route then answers HTTP 503). While no reading is cached, `message` says why. Every
        row carries `operator_position_disclosure`, dated when the response is served.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of: {}
                  cached_count:
                    type: integer
                  engine:
                    type: string
                  fresh_count:
                    type: integer
                  full_analysis:
                    type: object
                  message:
                    type: string
                  note:
                    type: string
                  requested_count:
                    type: integer
                  stale_after_seconds:
                    type: integer
                  symbols:
                    type: array
        '429':
          description: Rate limit exceeded
        '503':
          description: 'The engine is unavailable: a failed or paused run, a loop that is not reporting,
            or a cache that cannot be read. The body has the same shape as the 200: `engine` is `unavailable`,
            and `message` says why while no reading is cached (`reason` instead when the gateway has no
            connection to the cache).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  engine:
                    type: string
                    enum:
                    - unavailable
                  message:
                    type: string
                    description: Why, in plain language, while no reading is cached. Absent when every
                      cache read failed and when the gateway has no connection to the cache.
                  reason:
                    type: string
                    description: Present instead of `message` when the gateway has no connection to the
                      analysis cache.
                  symbols:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        regime:
                          type: string
                          nullable: true
                        regime_label:
                          type: string
                          nullable: true
                        age_seconds:
                          type: integer
                          nullable: true
                        stale:
                          type: boolean
                          nullable: true
                      required:
                      - symbol
                      - regime
                      - regime_label
                      - age_seconds
                      - stale
                    description: One row per covered symbol; empty when the gateway has no connection
                      to the analysis cache.
                  cached_count:
                    type: integer
                  fresh_count:
                    type: integer
                    description: Absent when the gateway has no connection to the analysis cache.
                  requested_count:
                    type: integer
                  as_of:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the newest cached reading was made; null when none is cached.
                  stale_after_seconds:
                    type: integer
                  note:
                    type: string
                  full_analysis:
                    type: object
                    description: Where the full reading is served.
                    properties:
                      endpoint:
                        type: string
                      tier:
                        type: string
                example:
                  engine: unavailable
                  message: The last AI generation run did not produce a reading; it retries automatically.
                  symbols:
                  - symbol: BTC
                    regime: null
                    regime_label: null
                    age_seconds: null
                    stale: null
                  - symbol: ETH
                    regime: null
                    regime_label: null
                    age_seconds: null
                    stale: null
                  - symbol: SOL
                    regime: null
                    regime_label: null
                    age_seconds: null
                    stale: null
                  cached_count: 0
                  fresh_count: 0
                  requested_count: 3
                  as_of: null
                  stale_after_seconds: 21600
                  note: 'Public status teaser: regime label and age only. Regime classification is descriptive,
                    not a prediction.'
                  full_analysis:
                    endpoint: /v1/analysis
                    tier: pro
                required:
                - engine
                - symbols
                - cached_count
                - requested_count
                - as_of
                - full_analysis
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      security:
      - {}
      - ApiKeyAuth: []
      tags:
      - Intelligence
      x-auth: none
      x-tier: public
      x-free-tier-symbols:
      - BTC
      - ETH
      - SOL
      - XAU
      - XAG
      operationId: get_v1_analysis_status
      x-response-measured: '2026-10-08'
      x-response-note: Field names and types below were recorded from one real response on 2026-10-08,
        not written by hand. A field absent from that response is absent here even if the endpoint can
        return it, and optional fields are not marked required. Treat this as a floor, not a closed set.
  /v1/billing/regime:
    get:
      summary: VAT regime in force
      description: |-
        The Italian VAT regime this business invoices under, read from `api_service/plans.json` — the single source of truth — and resolved for today. Public and keyless because peer systems (and anyone checking an invoice) must be able to read it without an account.

        RESOLVE IT FOR THE INVOICE'S OWN DATE, NOT FOR 'NOW'. The regime is a property of the operation date (`DataDocumento`), so an invoice issued before a regime change keeps the regime that was in force when it was issued. `regime_today` is a convenience for the common case; it is not a licence to stamp today's regime onto a back-dated document.

        `cache_s` is how long a caller may hold this before re-reading. An unreadable or malformed flag answers 503 rather than guessing a regime, so a peer keeps its last-good value instead of caching a fabricated one.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: VAT_REGIME is the flag peers read; `vat` is the full configuration behind
                  it.
                properties:
                  VAT_REGIME:
                    type: string
                  as_of:
                    type: string
                  cache_s:
                    type: integer
                  note:
                    type: string
                  regime_today:
                    type: string
                  schema_version:
                    type: integer
                  source:
                    type: string
                  vat:
                    type: object
                example:
                  schema_version: 1
                  VAT_REGIME: forfettario
                  vat:
                    regime: forfettario
                    effective_from: null
                    country: IT
                    rate: 0.22
                    crossed_100k_at: null
                    oss_registered: false
                  regime_today: forfettario
                  as_of: '2026-09-17T15:36:42+00:00'
                  source: api_service/plans.json
                  cache_s: 60
                  note: 'The regime is a property of the operation date: resolve it for the invoice''s
                    own DataDocumento, never for ''now''.'
        '429':
          description: Rate limit exceeded
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      security:
      - {}
      - ApiKeyAuth: []
      tags:
      - Meta
      x-auth: none
      x-tier: public
      x-free-tier-symbols:
      - BTC
      - ETH
      - SOL
      - XAU
      - XAG
      operationId: get_v1_billing_regime
      x-response-measured: '2026-10-08'
      x-response-note: Field names and types below were recorded from one real response on 2026-10-08,
        not written by hand. A field absent from that response is absent here even if the endpoint can
        return it, and optional fields are not marked required. Treat this as a floor, not a closed set.
  /v1/confirm:
    get:
      summary: Smart-money confirmation
      description: 'Score a trade the caller is about to take. One request reads the aggregated Bybit/Binance/Hyperliquid
        derivatives, on-chain metrics and tracked whale positioning for the symbol, and returns a verdict
        with the full arithmetic behind it: per-component scores and weights (`factors`), every signed
        modifier (`adjustments`), which data families actually had data (`coverage`), and per-source provenance
        and staleness (`meta`). A component with no data contributes a neutral 0 and the other weights
        are not rescaled to cover for it; `coverage` says which data families had data, and a leg withheld
        for licence reasons is null in its score, has weight 0 and is named in `withheld_sources`. This
        is an aggregation and transparency endpoint: it does not predict price, and `confidence` is not
        a probability. Free tier: BTC, ETH, SOL, XAU, XAG; no added delay; these fields are stripped from
        the body: deriv_score, details, onchain_score, reasons, whale_score.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: 'Confirmation verdict for the requested symbol and direction. Field presence
                  is tier-dependent: plans.json strip_fields removes evidence fields on restricted tiers,
                  and the NO_DATA branch omits the scored-branch fields, so only the verdict fields are
                  required.'
                properties:
                  action:
                    type: string
                    enum:
                    - CONFIRM_FULL
                    - CONFIRM_REDUCED
                    - CONFIRM_MINIMAL
                    - VETO_SKIP
                    - NO_DATA_SKIP
                    description: 'The verdict. NO_DATA_SKIP is deliberately distinct from VETO_SKIP: it
                      means nothing was measured, not that the data was negative.'
                  decision:
                    type: string
                    enum:
                    - CONFIRM
                    - REDUCE
                    - SKIP
                    - ABSTAIN
                    description: Canonical coarse enum derived from confidence/action. ABSTAIN covers
                      both LOW confidence and NO_DATA. Prefer this for branching.
                  confidence:
                    type: string
                    enum:
                    - HIGH
                    - MEDIUM
                    - LOW
                    - VETO
                    - NO_DATA
                    description: Bucketed composite. NOT a probability and NOT calibrated to any hit rate.
                  composite:
                    type: number
                    minimum: -1.5
                    maximum: 1.5
                    description: 'Final score for the requested direction after weighting and adjustments.
                      Unitless: not a price target and not an expected return.'
                  base_composite:
                    type: number
                    description: Weighted factor sum BEFORE the `adjustments` are applied. Absent on the
                      blacklist-VETO and NO_DATA branches.
                  size_mult:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: 'Suggested fraction of the caller''s normal position size for this confidence
                      bucket, after a liquidation-distance reduction. Not risk management: it knows nothing
                      about the caller''s account.'
                  unsupported:
                    type: boolean
                    description: true only when the symbol is outside the tracked universe (no derivatives
                      AND no whale data). Then action=NO_DATA_SKIP and every *_score is a zero meaning
                      'not measured'.
                  deriv_score:
                    type: number
                    minimum: -1
                    maximum: 1
                    description: 'Component score in [-1, +1], oriented to the requested direction: positive
                      supports it.'
                  onchain_score:
                    type: number
                    minimum: -1
                    maximum: 1
                    description: 'Component score in [-1, +1], oriented to the requested direction: positive
                      supports it.'
                  whale_score:
                    type: number
                    minimum: -1
                    maximum: 1
                    description: 'Component score in [-1, +1], oriented to the requested direction: positive
                      supports it.'
                  x_score:
                    type: number
                    enum:
                    - 0
                    description: Always 0. The X/social sentiment input is switched off and its weight
                      is renormalised to 0, so it cannot move the composite. Kept in the payload for client
                      compatibility.
                  coverage:
                    type: object
                    description: Which data families actually returned something. false means UNKNOWN
                      — that component had no data and contributes a neutral 0; the other weights are
                      not rescaled to cover for it. A leg withheld for licence reasons is null in its
                      score, has weight 0 and is named in `withheld_sources`.
                    properties:
                      derivatives:
                        type: boolean
                      whale:
                        type: boolean
                      onchain:
                        type: boolean
                  factors:
                    type: object
                    description: Per-component line items of the composite. Empty object {} on the NO_DATA
                      branch.
                    properties:
                      derivatives:
                        type: object
                        description: One line item of the composite.
                        properties:
                          score:
                            type: number
                            minimum: -1
                            maximum: 1
                            description: 'Component score in [-1, +1], oriented to the requested direction:
                              positive supports it.'
                          weight:
                            type: number
                            description: Nominal weight of this component in the composite.
                          weighted:
                            type: number
                            description: score x weight — this component's actual contribution to base_composite.
                      onchain:
                        type: object
                        properties:
                          score:
                            type: number
                            minimum: -1
                            maximum: 1
                            description: 'Component score in [-1, +1], oriented to the requested direction:
                              positive supports it.'
                          weight:
                            type: number
                          weighted:
                            type: number
                          source:
                            type: string
                            description: Which on-chain provider produced the score, e.g. coinmetrics_community,
                              glassnode, none.
                          available:
                            type: boolean
                      whale:
                        type: object
                        properties:
                          score:
                            type: number
                            minimum: -1
                            maximum: 1
                            description: 'Component score in [-1, +1], oriented to the requested direction:
                              positive supports it.'
                          weight:
                            type: number
                          weight_effective:
                            type: number
                            description: weight x staleness_factor — the weight actually used.
                          staleness_factor:
                            type: number
                            minimum: 0
                            maximum: 1
                            description: Decay applied when the whale consensus snapshot is old.
                          weighted:
                            type: number
                      x_sentiment:
                        type: object
                        description: One line item of the composite.
                        properties:
                          score:
                            type: number
                            minimum: -1
                            maximum: 1
                            description: 'Component score in [-1, +1], oriented to the requested direction:
                              positive supports it.'
                          weight:
                            type: number
                            description: Nominal weight of this component in the composite.
                          weighted:
                            type: number
                            description: score x weight — this component's actual contribution to base_composite.
                  adjustments:
                    type: object
                    description: Every post-scoring modifier, signed. base_composite plus these gives
                      composite, so a verdict is never a black box.
                    properties:
                      agreement:
                        type: number
                      trend:
                        type: number
                      rsi_1h:
                        type: number
                      news_macro:
                        type: number
                      momentum:
                        type: number
                      time_of_day:
                        type: number
                      streak_decay:
                        type: number
                  weights:
                    type: object
                    description: The weight set actually used for this call.
                    properties:
                      derivatives:
                        type: number
                      onchain:
                        type: number
                      whale_intel:
                        type: number
                  weights_mode:
                    type: string
                    description: Which weight set was selected, e.g. free, full, free_x, full_x.
                  reasons:
                    type: array
                    items:
                      type: string
                    description: One human-readable line per contributing observation and per non-zero
                      adjustment. Stripped on tiers whose plans.json strip_fields lists it.
                  details:
                    type: object
                    description: Raw inputs behind each component (derivatives, onchain, whale, x_sentiment)
                      so the score can be recomputed. Stripped on tiers whose plans.json strip_fields
                      lists it.
                  meta:
                    type: object
                    description: Proof-carrying provenance for the verdict.
                    properties:
                      source:
                        type: object
                        description: Which table/provider each component came from.
                      source_ts:
                        type: object
                        description: Unix second of each component's underlying data, or null when unknown.
                      age_s:
                        type: object
                        description: Seconds since each component's source_ts, or null when unknown.
                      coverage:
                        type: object
                        description: Copy of the top-level coverage object.
                      stale:
                        type: boolean
                        description: true when ANY component is past its freshness budget or has no timestamp.
                      stale_by_source:
                        type: object
                        description: Per-component staleness flags.
                      model_version:
                        type: string
                      expires_at:
                        type: integer
                        description: Unix second after which this verdict should be recomputed.
                  multi_timeframe:
                    type: object
                    description: The same component scores re-weighted for short / medium / long horizons,
                      each with composite, confidence, weights_used and timeframe_label. Horizons are
                      tier-gated. A leg withheld for licence reasons (null score) has weight 0 in every
                      horizon and the other weights are not rescaled to cover for it; while a leg is withheld
                      a horizon reads HIGH only when the headline `confidence` is HIGH, otherwise MEDIUM
                      at most.
                  personalized:
                    type: object
                    description: The caller's saved risk tolerance and base trade size turned into a suggested
                      USD figure. Carries its own disclaimer field. Arithmetic on caller-supplied numbers,
                      not advice.
                  ai_analysis:
                    type: object
                    description: 'LLM summary of the SAME numbers (regime, conflicts, risk factors) plus
                      provider (`local` or `hosted`: where it ran), ai_backend and generation_time_ms.
                      It has no extra information; if it disagrees with `composite`, `composite` is the
                      machine-readable answer.'
                  symbol:
                    type: string
                    description: Echo of the requested base symbol.
                  direction:
                    type: string
                    enum:
                    - long
                    - short
                    description: Echo of the direction that was scored.
                  ts:
                    type: integer
                    description: Unix second the verdict was computed.
                  source:
                    type: string
                    description: Caller-supplied ?source= tag, echoed back.
                  model_version:
                    type: string
                    description: Scoring model version. Scores are not comparable across a change of this
                      value.
                  operator_position_disclosure:
                    type: object
                    description: 'Whether the operator''s automated trading accounts hold a position in
                      the asset (MiCA Art. 91(2)(c) conflict disclosure). A historical signal carries
                      the value recorded when it was published; one with no record is ''unavailable''.
                      Unavailable value: {"status": "unavailable", "side": null, "as_of": null, "source_age_s":
                      null, "text": "Operator position data is unavailable right now; the operator''s
                      automated trading accounts may hold a position in this asset."}.'
                    properties:
                      symbol:
                        type: string
                        description: Normalised base asset (BTCUSDT, BTC-PERP -> BTC).
                      status:
                        type: string
                        enum:
                        - holding
                        - not_holding
                        - unavailable
                        description: not_holding is asserted only from position data at most 900 s old;
                          stale, missing or unreadable data is unavailable.
                      side:
                        type: string
                        nullable: true
                        description: long, short or mixed (opposite sides across accounts) when holding
                          and the side is known. null when not holding or unavailable, and also when holding
                          while an account that is stale, stopped or unreadable may hold the asset on
                          another side (the text then says "hold a position").
                      as_of:
                        type: string
                        nullable: true
                        description: UTC time of the position data, YYYY-MM-DDTHH:MM:SSZ; null when unavailable.
                      source_age_s:
                        type: integer
                        nullable: true
                        description: Age of that data in seconds when the disclosure was made; null when
                          unavailable.
                      text:
                        type: string
                        description: The sentence to show next to the signal.
                    example:
                      symbol: BTC
                      status: holding
                      side: long
                      as_of: '2026-10-01T16:00:00Z'
                      source_age_s: 42
                      text: The operator's automated trading accounts hold a long position in BTC (as
                        of 2026-10-01 16:00 UTC).
                    required:
                    - symbol
                    - status
                    - side
                    - as_of
                    - source_age_s
                    - text
                required:
                - ts
                - symbol
                - direction
                - action
                - confidence
                - composite
                - size_mult
                - model_version
                - operator_position_disclosure
