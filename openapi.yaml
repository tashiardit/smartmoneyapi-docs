  /v1/l2/depth-venues:
    get:
      summary: L2 depth venue + continuity table
      description: 'Every venue the depth collector knows: whether it is cleared to reach a paying subscriber
        (the SAME licence answer as the trade tape, read from ops/l2_collector/dataset.py''s SOURCE_TERMS),
        and WHICH CONTINUITY MODEL it proves itself with -- an update-id chain, a CRC32 book-state checksum,
        or a periodic snapshot that claims no continuity at all. Venues deliberately NOT collected are
        named with the specific unmeasured thing that blocks them, not a vague ''unsupported''.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset_version:
                    type: string
                  redistributable_venues:
                    type: array
                  venues:
                    type: object
                    description: 'One entry per collected venue: venue, may_reach_subscriber, licence,
                      origin, note, continuity model and the live evidence for it.'
                  refused:
                    type: object
                    description: Venues not collected, each with the specific blocker.
        '429':
