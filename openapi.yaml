                      stale:
                        type: boolean
                  snapshot_ts:
                    type: integer
                  symbols:
                    type: array
                  validation_by_cohort:
                    type: object
                  coverage:
                    type: object
                    description: 'The complete-sweep snapshot''s own coverage, exactly as recorded; before
                      the first snapshot {state: missing, missing_reason: no_snapshot}.'
                    properties:
                      state:
                        type: string
                      complete:
                        type: boolean
