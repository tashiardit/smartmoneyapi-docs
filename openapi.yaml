        (~11s), served through a 30-minute cache. `backfilled` covers only the handful of symbols that
        were ever backfilled, NOT the whole tracked universe -- read `backfilled.instruments`/`backfilled.symbols`,
        never a symbol count multiplied by a venue count. Six of nine venues publish no historical open-interest
        endpoint, so an empty `rows_with_open_interest` for them is a venue limitation, not a gap in collection.
