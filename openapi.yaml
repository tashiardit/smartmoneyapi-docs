        for the full table). The refusal fires even when the store holds zero matching rows for that venue/window,
        so an empty result and a licence refusal can never be confused for one another. `start`/`end`
        are ISO-8601 UTC timestamps rounded down to the hour; the window is capped at 6 hours per request.
        `limit` caps the rows returned (default 5,000, capped at 20,000) -- `truncated`, `row_count` and
        `rows_available` in the response report a cut explicitly rather than silently. The response also
        carries the dataset''s own coverage fields (`complete`, `hours_refused`, `window_covered_ms`,
        `dataset_version`, `source_terms`) so the limits of the extract travel with the data. An unreadable
        or unavailable store is **HTTP 503**, never 502/504.'
