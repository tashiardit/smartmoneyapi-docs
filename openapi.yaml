        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbols:
                    type: array
                    description: Ordered by event count, descending.
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        count:
                          type: integer
                        first_event_ts:
                          type: integer
                        last_event_ts:
                          type: integer
                        total_notional:
                          type: number
                  returned:
                    type: integer
                  total_symbols:
                    type: integer
                    description: Symbols on the tape before the limit was applied.
                  venues:
                    type: array
                    items:
                      type: string
                    description: Distinct exchanges present in the archive.
                  generated_at:
                    type: integer
                  source:
                    type: string
                    enum:
                    - archive
                    - unavailable
                  error:
                    type: string
                    description: Present only when source == 'unavailable'.
        '429':
          description: Rate limit exceeded
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
