  /v1/wallet/{addr}/profile:
    get:
      summary: Whale wallet profile
      description: 'Cross-venue profile for a tracked Hyperliquid whale, built from live position snapshots:
        current open positions, unrealized-PnL / exposure / position-count time series, an OPEN/CLOSE/FLIP
        activity timeline (diffed from consecutive snapshots), decoded HL-leaderboard label, and an open-book
        summary. pnl is HL''s own unrealized mark-to-market; value_usd is open notional. Realized P&L
        per round-trip is unavailable (only open snapshots are seen) and is returned as null. Valid-but-untracked
        address returns tracked=false; invalid address returns ok=false, error=invalid_address (HTTP 400).'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  wallet:
                    type: string
                  tracked:
                    type: boolean
                  first_seen_ts:
                    type: integer
                    nullable: true
                  latest_snapshot_ts:
                    type: integer
                    nullable: true
                  as_of:
                    type: integer
                    nullable: true
                  note:
                    type: string
                    description: Present when tracked=false.
                  error:
                    type: string
                    description: Present when ok=false (e.g. invalid_address).
                  hyperliquid:
                    type: object
                    properties:
                      label:
                        type: object
                        description: 'Decoded HL-leaderboard standing at discovery (HL''s own, not computed
                          here): name/score/window_pnl_usd/win_rate_pct/trades.'
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            venue:
                              type: string
                            symbol:
                              type: string
                            direction:
                              type: string
                            size:
                              type: number
                            entry_px:
                              type: number
                            unrealized_pnl:
                              type: number
                            leverage:
                              type: number
                            value_usd:
                              type: number
                      series:
                        type: array
                        description: <=360 decimated points.
                        items:
                          type: object
                          properties:
                            ts:
                              type: integer
                            unrealized_pnl:
                              type: number
                            exposure_usd:
                              type: number
                            positions:
                              type: integer
                      timeline:
                        type: array
                        description: <=120 events, newest-first. CLOSE events carry no P&L claim.
                        items:
                          type: object
                          properties:
                            ts:
                              type: integer
                            event:
                              type: string
                              enum:
                              - open
                              - close
                              - flip
                            symbol:
                              type: string
                            direction:
                              type: string
                            from_direction:
                              type: string
                            value_usd:
                              type: number
                      summary:
                        type: object
                        properties:
                          open_positions:
                            type: integer
                          in_profit:
                            type: integer
                          in_loss:
                            type: integer
                          longs:
                            type: integer
                          shorts:
                            type: integer
                          total_unrealized_pnl:
                            type: number
                          total_exposure_usd:
                            type: number
                          blended_leverage:
                            type: number
                          window_days:
                            type: integer
                          snapshots_in_window:
                            type: integer
                          realized_pnl:
                            type: number
                            nullable: true
                            description: Always null -- not derivable from open-only snapshots.
                          realized_pnl_note:
                            type: string
        '429':
          description: Rate limit exceeded
        '400':
          description: Invalid address
      parameters:
      - name: addr
        in: path
        required: true
        description: Wallet address.
        schema:
          type: string
      - name: days
        in: query
        description: Look-back window for series & timeline.
        schema:
          type: integer
          default: 30
