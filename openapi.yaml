  /v1/smart-stop:
    get:
      summary: Smart stop levels
      description: |-
        A stop price WITH the basis it was derived from. `stop_basis` records whether the recommendation came from a modelled liquidation cluster or from nothing but the caller's own `risk_pct` with no cluster read at all — two stops that look identical on the wire and mean completely different things. Read it before sizing anything.

        The cluster it may be aware of is the MODELLED ladder from /v1/liquidations, not an observed order book, and it carries that endpoint's caveats.

        TIERS. Trader receives 16 of the 22 fields, tagged per field below. Pro additionally receives `stops`, `stop_detail`, `avoid_zones`, `take_profit_suggestions`, `take_profit_basis`, `error`. Trader alone receives `recommended_stop`, `recommended_stop_detail`, `withheld`, `withheld_reason` — `recommended_stop` is the single stop lifted out of the Pro `stops` dict, and `recommended_stop_detail` is its slice of `stop_detail`. Whatever a plan removed is named per response in `withheld` (`withheld_reason: "trader_plan"`), and the qualifier fields for the stop that IS returned are never removed.

        Every type below was resolved from the expression that fills the field; where none could be, the property carries no `type` and says so, rather than a plausible guess a generated client would enforce.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Field list, tier tags, the `withheld` vocabulary and every property type
                  are read from api_gateway._handle_smart_stop and api_service/smart_stop.py at generation
                  time, not hand-written.
                properties:
                  symbol:
                    type: string
                    description: '[Trader and Pro] Base symbol this stop was computed for.'
                  direction:
                    type: string
                    description: '[Trader and Pro] Position direction the stop was placed for: long or
                      short.'
                  entry_price:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] The entry the stop distance is measured from. null
                      when none was supplied and no daemon price was readable — read `entry_price_source`
                      before treating it as the caller''s own number.'
                  entry_price_source:
                    type: string
                    description: '[Trader and Pro] Where `entry_price` came from: ''caller'' (you supplied
                      it), ''daemon_snapshot'' (inferred from the mark), or ''none''.'
                  current_price:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] The daemon mark at computation time, or null when it
                      could not be read. It is never the entry price wearing the mark''s name.'
                  price_reference:
                    type: number
                    nullable: true
                    description: '[Trader and Pro] The price the liquidation model was actually run against.'
                  price_reference_source:
                    type: string
                    description: '[Trader and Pro] ''daemon_snapshot'' when the mark was readable, ''caller_entry_price''
                      when it was not and your entry stood in for it. The second case is a stop measured
                      against your own input, not against the market.'
                  recommended_stop:
                    type: number
                    nullable: true
                    description: '[TRADER ONLY] The one stop price on this plan. null when no stop could
                      be placed. Read `stop_basis.status` before sizing: an identical number means completely
                      different things depending on it.'
                  recommended_stop_detail:
                    type: object
                    nullable: true
                    description: '[TRADER ONLY] Provenance of THIS stop only: which cluster informed it,
                      how far away it is, or the note saying no cluster did. The other labels'' detail
                      is in `stop_detail`.'
                  stop_basis:
                    type: object
                    description: '[Trader and Pro] Whether the stop came from a measured liquidation cluster,
                      from the caller''s own risk_pct with no cluster read, or from nothing at all. Carries
                      status, explanation, unavailable_reason, liquidation_data (''read'' vs ''unavailable''),
                      liquidation_error, bands_status and the level/cluster counts. This is the field
                      to branch on.'
                  risk_pct_reference:
                    type: object
                    nullable: true
                    description: '[Trader and Pro] The risk_pct arithmetic, LABELLED as arithmetic, offered
                      only when no cluster informed the stops. null otherwise. It is not a recommendation.'
                  risk_pct_requested:
                    type: number
                    description: '[Trader and Pro] The risk_pct the request asked for, echoed back.'
                  liq_cascade_risk:
                    description: '[Trader and Pro] The estimator''s cascade bucket for this symbol, or
                      its word for an absence. It is not smoothed into a reassuring value when unknown.
                      NO JSON TYPE IS PUBLISHED for this field: no type could be derived from the source
                      expression that fills it, and a guessed type in a schema that clients generate against
                      is worse than a missing one. Unstated is not permissive — treat the shape as unverified.'
                  withheld:
                    type: array
                    description: '[TRADER ONLY] Machine-readable list of what THIS response had removed
                      by plan. Vocabulary: `avoid_zones`, `stops.tight_and_wide`, `take_profit_suggestions`.
                      Computed per response, so a response the model left empty anyway reports no boundary.'
                  withheld_reason:
                    type: string
                    enum:
                    - trader_plan
                    description: '[TRADER ONLY] Why those entries were removed. ''trader_plan'' means
                      the plan removed them; an absent field means nothing was. This is how a consumer
                      separates ''not in your plan'' from ''the server had nothing'', which a missing
                      key cannot express.'
                  ts:
                    type: integer
                    description: '[Trader and Pro] Unix timestamp the stop was computed.'
                  stops:
                    type: object
                    description: '[PRO/ENTERPRISE ONLY] The full tight / recommended / wide dict. All
                      three are null when `stop_basis.status` reports the analysis could not be performed.'
                  stop_detail:
                    type: object
                    description: '[PRO/ENTERPRISE ONLY] Per-label provenance for all three stops, same
                      shape as `recommended_stop_detail`.'
                  avoid_zones:
                    type: array
                    description: '[PRO/ENTERPRISE ONLY] The liquidation clusters the stops were placed
                      around.'
                  take_profit_suggestions:
                    type: object
                    description: '[PRO/ENTERPRISE ONLY] Reward/risk ladder keyed by label. Every value
                      is null unless the recommended stop came from a measured cluster — there is no measured
                      risk to build a ladder on otherwise, and the ratios would only re-express your own
                      risk_pct.'
                  take_profit_basis:
                    type: string
                    nullable: true
                    description: '[PRO/ENTERPRISE ONLY] What the take-profit ladder was measured against,
                      or null when there was nothing to measure. An all-null ladder with no basis would
                      leave you guessing between ''no stop'' and ''no TP model''.'
                  error:
                    type: string
                    nullable: true
                    description: '[PRO/ENTERPRISE ONLY] Set only on the degraded response where no entry
                      price could be determined at all. NOTE: the Trader reshape does not forward it,
                      so on that plan the same condition is readable from `stop_basis.unavailable_reason`
                      instead.'
        '429':
          description: Rate limit exceeded
        '401':
          description: Missing or invalid API key
        '402':
          description: Endpoint not included in your plan (response carries an upgrade CTA)
      parameters:
      - name: symbol
        in: query
        description: Base symbol, e.g. BTC.
        schema:
          type: string
          default: BTC
      - name: direction
        in: query
        description: Position direction.
        schema:
          type: string
          default: long
          enum:
          - long
          - short
      - name: entry_price
        in: query
        description: Entry price; omit to use current price.
        schema:
          type: number
      - name: risk_pct
        in: query
        description: Risk percentage of account.
        schema:
          type: number
          default: 2.0
      tags:
      - Trading tools
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      x-auth: required
      x-tier: Trader (3,000 calls/day)
