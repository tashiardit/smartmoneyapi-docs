  /v1/analysis:
    get:
      summary: AI market analysis
      description: 'Latest AI-written market commentary over the aggregated data. Commentary only — it
        is not a prediction and carries no measured edge. It includes a `recommendation`, so the response
        carries `operator_position_disclosure` for its symbol, dated when served. `provider` says where
        it ran: `local` (the operator''s own hardware) or `hosted` (a hosted model service); the exact
        model is named in `ai_backend`. It covers BTC, ETH and SOL only; any other symbol is refused with
        400 `symbol_not_covered`, naming what is covered. A covered symbol with no reading yet answers
        202 `not_cached` with an `engine` state (as under /v1/analysis/status) and a `message`; readings
        are generated when requested, and the first request may take up to a few minutes.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Rate limit exceeded
        '401':
          description: Missing or invalid API key
        '402':
          description: Endpoint not included in your plan (response carries an upgrade CTA)
        '202':
          description: 'No reading is cached for this symbol yet. This is the normal first answer: readings
            are generated when requested, so this request is what asks for one. Ask again after a short
            wait; the first request may take up to a few minutes. `engine` says what the engine is doing,
            for this symbol.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    description: The symbol asked for.
                  status:
                    type: string
                    enum:
                    - not_cached
                  engine:
                    type: string
                    enum:
                    - on_demand
                    - warming
                    - unavailable
                    description: 'What the engine is doing, as under /v1/analysis/status. Never `ok` or
                      `stale`: those need a cached reading, which this answer lacks.'
                  message:
                    type: string
                    description: The engine's state in plain language, for this symbol.
                example:
                  symbol: BTC
                  status: not_cached
                  engine: on_demand
                  message: AI regime readings are generated when requested; the first request may take
                    up to a few minutes.
                required:
                - symbol
                - status
                - engine
                - message
        '400':
          description: 'A symbol the AI regime engine does not cover (it covers BTC, ETH and SOL only).
            Nothing is read and no reading is requested; `error` is `symbol_not_covered` and `covered_symbols`
            lists what is covered. Also: error=non_canonical_path: Request paths must be canonical: no
            ''.'' or ''..'' segments, no empty segments (''//''), no backslashes, and no percent-encoded
            ''.'', ''/'' or ''\''. Send the path as documented. Refused before routing, on every route;
            `reason` is one of dot_segment, empty_segment, backslash, encoded_separator. The query string
            is never checked; one trailing slash and any letter case are accepted.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - symbol_not_covered
                    - non_canonical_path
                  message:
                    type: string
                  symbol:
                    type: string
                    description: The symbol as sent, capped at 24 characters (symbol_not_covered only).
                  covered_symbols:
                    type: array
                    items:
                      type: string
                    description: What the engine covers (symbol_not_covered only).
                  reason:
                    type: string
                    enum:
                    - dot_segment
                    - empty_segment
                    - backslash
                    - encoded_separator
                    description: Why the path was refused (non-canonical path refusals only).
                example:
                  error: symbol_not_covered
                  message: DOGE is not covered by the AI regime engine, which covers BTC, ETH, SOL only.
                  symbol: DOGE
                  covered_symbols:
                  - BTC
                  - ETH
                  - SOL
                required:
                - error
                - message
        '403':
          description: 'The caller''s tier is below Pro: the route''s own last check. A plan that does
            not include this route is normally answered first, with the 402 above and an upgrade prompt.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - forbidden
                  message:
                    type: string
                example:
                  error: forbidden
                  message: AI analysis requires the Pro tier
                required:
                - error
                - message
        '503':
          description: The gateway has no connection to the analysis cache, so no reading can be served
            or requested. Retry shortly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - service_unavailable
                  message:
                    type: string
                required:
                - error
                - message
      parameters:
      - name: symbol
        in: query
        description: Base symbol, e.g. BTC.
        schema:
          type: string
          default: BTC
      security:
