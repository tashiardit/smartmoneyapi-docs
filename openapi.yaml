  /v1/l2/depth:
    get:
      summary: L2 order-book depth
      description: 'Raw order-book DEPTH updates for one venue over a bounded UTC hour window, read directly
        from the depth collector''s store (never written to). Licence-gated by the SAME allow-list as
        the trade tape: a venue whose terms forbid redistribution is refused with **HTTP 403** naming
        the venue and the exact reason from `SOURCE_TERMS[venue].note`, and the refusal fires even when
        the store holds zero matching rows, so an empty result and a licence refusal can never be confused.
        **Collecting a venue never made it servable** -- ten venues are collected, and only the redistributable
        ones are served here; see GET /v1/l2/depth-venues. Rows carry the venue''s OWN continuity evidence,
        and there are THREE different models: an update-id chain (`final_update_id` / `prev_final_update_id`,
        with `gap_count` in the coverage), a CRC32 BOOK-STATE checksum (`venue_checksum` / `checksum_verified`,
        kraken_spot -- which proves book state, NOT event delivery), and a periodic full SNAPSHOT with
        no continuity field at all (hyperliquid -- `gap_count` is null and MUST NOT be read as zero gaps).
        A row carries one model''s evidence or the other''s, never a blend. The window is capped at 2
        hours per request (depth rows are heavier than trades) and `limit` defaults to 2,000, capped at
        10,000; a cut is reported explicitly. An unreadable or unavailable store is **HTTP 503**, never
        502/504.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    type: string
                  symbol:
                    type: string
                  rows:
                    type: object
                    description: 'Depth rows: exchange_ts, local_recv_ts, venue, symbol, bid_prices, bid_sizes,
                      ask_prices, ask_sizes, bid_levels, ask_levels, bid_levels_dropped, ask_levels_dropped,
                      is_snapshot, source, and the continuity evidence for whichever model this venue
                      uses (first/final/prev_update_id, or venue_checksum + checksum_verified, or neither).'
                  row_count:
                    type: integer
                  rows_available:
                    type: integer
                  truncated:
                    type: boolean
                  limit:
                    type: integer
                  dataset_version:
                    type: string
                  complete:
                    type: boolean
                  coverage:
                    type: array
                  hours_refused:
                    type: array
                  window_requested_utc:
                    type: array
                  window_covered_ms:
                    type: array
                  source_terms:
                    type: object
                    description: Keyed by venue served; each entry is that venue's SourceTerms.
        '429':
          description: Rate limit exceeded
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      parameters:
      - name: venue
        in: query
        description: Venue id, e.g. binance_usdm. See GET /v1/l2/depth-venues for the full list. Required.
        schema:
          type: string
        required: true
      - name: symbol
        in: query
        description: Restrict to one symbol (e.g. BTCUSDT). Omit to include every symbol the store collected
          in the window.
        schema:
          type: string
      - name: start
        in: query
        description: Window start, ISO-8601 UTC. Defaults to one hour before `end`.
        schema:
          type: string
      - name: end
        in: query
        description: Window end, ISO-8601 UTC, exclusive. Defaults to the current UTC hour.
        schema:
          type: string
      - name: limit
        in: query
        description: Max rows returned. Default 2,000, capped at 10,000.
        schema:
          type: integer
          default: 2000
          minimum: 1
          maximum: 10000
      security:
      - {}
      - ApiKeyAuth: []
