openapi: 3.0.3
info:
  title: Smart Money API
  version: 1.0.0
  description: |-
    Real-time smart-money intelligence from smartmoneyapi.com: cross-exchange derivatives aggregation (Bybit, Binance, Hyperliquid), 2000+ tracked whale wallets, liquidation streams, options, ETF flows, on-chain metrics and news intelligence. Public endpoints work without a key (reduced rows / per-IP throttle); an X-API-Key unlocks tier quotas and the gated endpoints.

    Free tier: 100 calls/day, 2/minute, BTC, ETH, SOL only, no data delay.

    Every operation carries x-auth (none|required) and x-tier, both derived from the gateway source and plans.json rather than written by hand. Generated by ops/gen_openapi.py.

    HOW THIS FILE IS PRODUCED — it is generated, never hand-edited.

    It is a filtered mirror of the document the API itself serves at https://smartmoneyapi.com/openapi.json, emitted by tools/build_public_spec.py in github.com/tashiardit/smartmoneyapi-docs. An operation from the live document appears here iff all three hold:

      1. The method is GET. This mirror is a read-only DATA contract; nothing that mutates state or account configuration is published, so a client generated from this file cannot change anything in an account.
      2. It carries x-auth and x-tier. Upstream those are derived from the gateway's own public-endpoint set and from plans.json rather than written by hand, so the gating printed on each operation here is the gating the server enforces.
      3. Its namespace is not account-management or internal — the withheld set is listed in tools/build_public_spec.py with a reason for each, and covers routes that act on your account (alerts, webhooks, watchlist, portfolio, preferences, referrals, usage, telegram, assistant, purchases, socket tickets) or on our own operations.

    One stated exception to (1): the /rpc/v1/* JSON-RPC proxies are POST because JSON-RPC is a POST protocol, not because they change anything of ours. They proxy read-only node calls, so they are published.

    Paid tiers ARE published: you should be able to read the exact shape of what a subscription returns before paying for it. Per-operation x-auth says whether a key is needed at all; x-tier names the plan that unlocks it. Public operations answer without a key at a reduced row cap and a per-IP throttle.

    Mirror generated 2026-08-28 from https://smartmoneyapi.com/openapi.json (read from a local copy): 207 of 263 live paths.
