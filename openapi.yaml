  /v1/coverage:
    get:
      summary: Derivatives field coverage matrix
      description: How completely each tracked field (funding, open interest, long/short ratio, ...) is
        populated per venue over a lookback window, plus one symbol's per-venue/per-field detail when
        `?symbol=` is given. `venues_registry_only` names venues the instrument registry knows about but
        that never actually wrote a row in the window -- a registry entry is not evidence of collection.
        `listing_source` and `declaration` carry the metadata this matrix reasons from (what we believe
        is listed, and on what evidence) alongside `declaration_conflicts`, so a coverage gap can be told
        apart from a symbol that was never listed anywhere. `window_seconds` is clamped to [3600, 604800]
        (1h-7d); an out-of-range or unparsable value falls back to the clamped/default value rather than
        erroring. `?symbol=` other than alphanumeric/`_`/`-` is a 400 `bad_symbol`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  generated_at:
                    type: integer
                  source_table:
                    type: string
                  window:
                    type: object
                  symbols_observed:
                    type: integer
                  venues_collected:
                    type: array
                  venues_in_instrument_registry:
                    type: array
                  venues_registry_only:
                    type: array
                  fields:
                    type: array
                  status_labels:
                    type: object
                  status_buckets:
                    type: object
                  listing_source:
                    type: object
                  declaration:
                    type: object
                  declaration_conflicts:
                    type: array
                  per_field:
                    type: object
                    description: 'Per tracked field: distribution, buckets, per_venue counts, symbols_with_at_least_one_venue.
                      Empty when status != ok.'
                  symbol:
                    type: string
                  venues:
                    type: object
                    description: 'Present only with ?symbol=: per-venue, per-field cell detail for that
                      one symbol.'
                  not_claimed:
                    type: array
        '429':
          description: Rate limit exceeded
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      parameters:
      - name: window_seconds
        in: query
        description: Lookback window in seconds, clamped to [3600, 604800].
        schema:
          type: integer
          default: 86400
          minimum: 3600
          maximum: 604800
      - name: symbol
        in: query
        description: Restrict to one symbol's per-venue/per-field detail instead of the full matrix. Alphanumeric
          plus '_'/'-', max 24 chars.
        schema:
          type: string
      security:
      - {}
      - ApiKeyAuth: []
      tags:
      - Derivatives
      x-auth: none
      x-tier: public
      x-free-tier-symbols:
      - BTC
      - ETH
      - SOL
      - XAU
      - XAG
      operationId: get_v1_coverage
