                        - partial
                        - stale
                        - missing
                        - unreadable
                      served_at:
                        type: integer
                      error:
                        type: string
                      last_refresh_error:
                        type: object
                  versions:
                    type: object
                  data_mode:
                    type: string
                    nullable: true
                    enum:
                    - live
                    - backfilled
                    - null
                    description: live or backfilled; null where no capture backs the body (e.g. /validation,
                      which is derived, before its first run).
                  basis:
                    type: string
                  note:
                    type: string
                  meta:
                    type: object
                    description: 'Read from `freshness` alone: no measured source timestamp -> state unknown,
                      stale true.'
                    properties:
                      source_ts:
                        type: integer
                        nullable: true
                      age_s:
                        type: integer
                        nullable: true
                      state:
                        type: string
                        enum:
                        - fresh
                        - stale
                        - unknown
                      stale:
                        type: boolean
                  symbol:
                    type: string
                  market:
                    type: object
                  report_family:
                    type: string
                  report_name:
                    type: string
                  report_date:
                    type: string
                  report_as_of:
                    type: object
                  released_ts:
                    type: integer
                  available_ts:
                    type: integer
                  lookback_weeks:
                    type: integer
                  n_obs:
                    type: integer
                  expected_obs:
                    type: integer
                  window_complete:
                    type: boolean
                  window:
                    type: object
                  methods:
                    type: object
                  categories:
                    type: array
                  rows_excluded:
                    type: object
                  caveats:
                    type: array
                  validation:
                    type: object
                  source:
                    type: string
                  data_mode_counts:
                    type: object
                  dataset_id:
                    type: string
                  metric:
                    type: string
                  availability_rule:
                    type: string
        '429':
          description: Rate limit exceeded
        '400':
          description: 'invalid_param: a parameter is malformed or out of range. Also: error=non_canonical_path:
            Request paths must be canonical: no ''.'' or ''..'' segments, no empty segments (''//''),
            no backslashes, and no percent-encoded ''.'', ''/'' or ''\''. Send the path as documented.
