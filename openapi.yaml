      description: 'What the tracked accounts hold on Hyperliquid perps, per symbol, from a complete sweep
        of the tracked accounts: long/short/net/gross USD, counts, observed addresses and an independent-participant
        estimate. The everyone row (`all_tracked`) is always served. The row of a membership cohort is
        added only when cohort disclosure is enabled (see `disclosure_control`); otherwise the response
        carries the everyone row alone, and a `cohort` filter naming a membership cohort that is not served
        returns no rows. Under disclosure control a membership cohort''s cells come from the newest UTC-day
        snapshot (`cohort_snapshot_ts`) and are rounded, a cell or side under the floor is omitted or
        withheld (`withheld_fields`), and concentration and divergence are withheld; where membership
        is published the cells are exact. `include` adds concentration and divergence to the exact rows.
        Every cell that is served carries `state` (observed|missing|stale); a measured zero is observed
        0, a missing value is null with a missing_reason. Descriptive, not a forecast.'
