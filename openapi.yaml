                        type: integer
                      count_rounding:
                        type: integer
                      usd_significant_figures:
                        type: integer
                      dominance:
                        type: string
                      partitions:
                        type: string
                      small_cells:
                        type: string
                      cohort_cells:
                        type: string
                        description: In words, what a membership cohort's cells are under the mode in
