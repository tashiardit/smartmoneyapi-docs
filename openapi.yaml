  /v1/options/iv-surface:
    get:
      summary: Implied-volatility surface (one book)
      description: 'Per-instrument implied-volatility surface for one Deribit option book (BTC, ETH, or
        a USDC-linear book such as BTC_USDC, SOL_USDC, HYPE_USDC). Every `iv_pct` on a node is Deribit''s
        own published mark IV, carried through unchanged; anything this endpoint derives itself (an interpolated
        ATM point, a fixed-moneyness skew point, the 25-delta risk reversal) is labelled `fitted: true`
        under its own key and never mixed into a measured field. The surface is SPARSE: `grid.rectangle_cells`
        (n_strikes x n_expiries) is not the number of quoted cells, and holes are listed per expiry rather
        than interpolated into the node set. `nodes` (the actual per-strike quotes) is included only with
        `?nodes=1` -- omitted by default because the full BTC node set is ~440KB against ~92KB without
        it on a keyless route. An unknown book or an upstream Deribit fetch failure both return 200 with
        `status` naming the failure (fetch_failed / unknown_book) rather than a 4xx/5xx, so a caller following
        `status` never has to special-case a non-2xx response; a genuine internal error (module failed
        to import) is a 503 with `error=capability_unavailable`.'
      responses:
        '451':
          description: Withheld for licence reasons. Deribit's terms could not be read by automated fetch
            and an earlier browser read suggested they bar publishing derived data; withheld until reviewed.
            This endpoint therefore refuses every caller, including authenticated ones, before any tier
            check. The body carries error=withheld_for_licence, source=deribit and the condition under
            which it would be re-enabled.
        '400':
          description: 'error=non_canonical_path: Request paths must be canonical: no ''.'' or ''..''
            segments, no empty segments (''//''), no backslashes, and no percent-encoded ''.'', ''/''
            or ''\''. Send the path as documented. Refused before routing, on every route; `reason` is
            one of dot_segment, empty_segment, backslash, encoded_separator. The query string is never
            checked; one trailing slash and any letter case are accepted.'
      parameters:
      - name: book
        in: query
        description: Deribit option book identifier (the part of an instrument name before the first '-').
          BTC and ETH are coin-margined; each also lists a separate USDC-linear book (BTC_USDC, ETH_USDC,
          ...). See /v1/options/iv-surface/books for the full list.
        schema:
          type: string
          default: BTC
      - name: nodes
        in: query
        description: Include the full per-strike/expiry node grid (call+put mark IV, quote_state, greeks).
          Accepts 1/true/yes; anything else is treated as 0. Default 0 (grid + term-structure + skew only,
          no nodes).
        schema:
          type: string
          default: '0'
      security: []
      tags:
      - Options
      x-auth: n/a
      x-tier: withheld
