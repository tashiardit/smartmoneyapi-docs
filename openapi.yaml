  /v1/smart-money/activity:
    get:
      summary: Wallet activity
      description: 'What wallets did in an interval: open, add, reduce, close, flip, deposit, withdraw
        and transfers on Hyperliquid, or swap and transfer legs on bsc/avalanche read from our own node''s
        scan (no cohorts; swap legs carry no direction because the ingest does not record one). bsc/avalanche
        answer 451 withheld_for_licence until the rights registry clears them; the shape is what they
        serve once cleared. A price move is never an activity event. The span is at most 7 days; the lookback
        is per plan (`features.sm_history_days`) and a clamp is reported in `lookback_clamped_by_tier`.
        `execution_context` separates observations from labelled estimates; on bsc/avalanche the honeypot
        probe is an estimate that does not execute the token''s transfer hooks, and the Etherscan-derived
        contract source scan is withheld. No safety score, rating or recommendation is ever returned.
        Per-address cohort tags would list a cohort''s members, so they are served only when membership
        is published; otherwise `cohorts` is null with `cohorts_state: "withheld"`, and a `cohort` filter
        answers 451 `withheld` with reason `member_lists`. An address on the privacy suppression list
        is never returned (on bsc/avalanche, neither as the wallet nor as the counterparty); if the list
        cannot be read the request answers 503.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:
                    type: integer
                    description: When the response was assembled -- never the data time (see `updated`,
                      `freshness`).
                  updated:
                    type: integer
                    description: The datum time (freshness.source_timestamp); absent when nothing measured
                      dates the body.
                  venue:
                    type: string
                  scope:
                    type: string
                  licence_class:
                    type: string
                  rights:
                    type: object
                  freshness:
                    type: object
                    description: 'Computed when the response is SERVED, not when it was cached: a last-good
                      copy older than stale_after_s reads `stale`.'
                    properties:
                      source_timestamp:
                        type: integer
                        nullable: true
                      received_at:
                        type: integer
                        nullable: true
                      staleness_s:
                        type: integer
                        nullable: true
                      stale_after_s:
                        type: integer
                        nullable: true
                      coverage_status:
                        type: string
                        enum:
                        - complete
                        - partial
                        - stale
                        - missing
                        - unreadable
                      served_at:
                        type: integer
                      error:
                        type: string
                      last_refresh_error:
                        type: object
                  versions:
                    type: object
                  data_mode:
                    type: string
                    nullable: true
                    enum:
                    - live
                    - backfilled
                    - null
                    description: live or backfilled; null where no capture backs the body (e.g. /validation,
                      which is derived, before its first run).
                  basis:
                    type: string
                  note:
                    type: string
                  meta:
                    type: object
                    description: 'Read from `freshness` alone: no measured source timestamp -> state unknown,
                      stale true.'
                    properties:
                      source_ts:
                        type: integer
                        nullable: true
                      age_s:
                        type: integer
                        nullable: true
                      state:
                        type: string
                        enum:
                        - fresh
                        - stale
                        - unknown
                      stale:
                        type: boolean
                  from:
                    type: integer
                  to:
                    type: integer
                  chain:
                    type: string
                  from_requested:
                    type: integer
                  history_days_limit:
                    type: integer
                  lookback_clamped_by_tier:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
                    description: null on the last page
                  scan:
                    type: object
                  events:
                    type: array
                  cohort_labels:
                    type: object
                    description: cohort id -> label, for the cohorts the events carry (empty while tags
                      are withheld)
                  universe:
                    type: string
        '429':
          description: Rate limit exceeded
        '400':
          description: 'invalid_param: a parameter is malformed or out of range. Also: error=non_canonical_path:
            Request paths must be canonical: no ''.'' or ''..'' segments, no empty segments (''//''),
            no backslashes, and no percent-encoded ''.'', ''/'' or ''\''. Send the path as documented.
            Refused before routing, on every route; `reason` is one of dot_segment, empty_segment, backslash,
            encoded_separator. The query string is never checked; one trailing slash and any letter case
            are accepted.'
        '451':
          description: 'Two refusals, told apart on `error`. `withheld`: the disclosure setting does not
            serve what was asked -- a `cohort` filter when membership is not published. The body carries
            `reason` (`member_lists`) and `reversible_with`, the operator decision that would change the
            answer. `withheld_for_licence`: the rights registry has not cleared this dataset for this
            use. The body names the registry_key.'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: The disclosure setting does not serve what was asked.
                  properties:
                    error:
                      type: string
                      enum:
                      - withheld
                    message:
                      type: string
                    reason:
                      type: string
                      enum:
                      - member_lists
                      description: a `cohort` filter when membership is not published
                    reversible_with:
                      type: string
                      description: the operator decision that would change the answer
                  required:
                  - error
                  - message
                  - reason
                  - reversible_with
                - type: object
                  description: The rights registry has not cleared this dataset for this use.
                  properties:
                    error:
                      type: string
                      enum:
                      - withheld_for_licence
                    reason:
                      type: string
                    message:
                      type: string
                    source:
                      type: string
                    registry_key:
                      type: string
                      description: the rights-registry key that is not cleared for this use
                    reversible_with:
                      type: string
                  required:
                  - error
        '503':
          description: 'smart_money_unavailable / source_unavailable: the store is not readable or not
            built yet; not_available: the data module is not deployed. Never 502/504.'
        '401':
          description: Missing or invalid API key
        '402':
          description: Endpoint not included in your plan (response carries an upgrade CTA)
      parameters:
      - name: from
        in: query
