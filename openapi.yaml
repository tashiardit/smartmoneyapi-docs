    get:
      summary: Measured funding-settlement clock
      description: 'Per-venue summary of the MEASURED funding-settlement interval, derived from each venue''s
        own settlement timestamps (never from documentation): the newest gap, extended backwards while
        consecutive gaps agree. A median over full history is deliberately NOT used -- a venue that changed
        its clock mid-history (observed: Binance moved COTIUSDT from hourly to 4-hourly settlement) makes
        the median wrong for however long the new clock has been running. `venues_measured` only lists
        venues with a usable measurement; `venues_unmeasured` lists the rest, so a venue can never silently
        vanish from the coverage claim. `refuses_measurements_older_than_days` names the staleness bound
        past which a per-instrument measurement is refused rather than trusted.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  basis:
                    type: string
                  how_measured:
                    type: string
                  venues_measured:
                    type: array
                  venues_unmeasured:
                    type: array
                  totals:
                    type: object
                    properties:
                      instruments_measured:
                        type: integer
                      instruments_refused:
                        type: integer
                      settlement_gaps:
                        type: integer
                  refuses_measurements_older_than_days:
                    type: integer
                  venues:
                    type: object
                    description: Keyed by venue; each entry is the venue's raw coverage record plus measurement_age_days
                      (derived from the measurement's own timestamp, so a stale sweep is visible in the
                      payload).
