        schema:
          type: string
      - name: symbol
        in: query
        description: Hyperliquid coin, matched case-insensitively (e.g. BTC, kPEPE).
        schema:
          type: string
      - name: kind
        in: query
        description: 'Comma-separated kinds. hyperliquid: open, add, reduce, close, flip, transfer_in,
          transfer_out, deposit, withdraw. bsc/avalanche: swap, transfer_in, transfer_out.'
        schema:
          type: string
      - name: min_usd
        in: query
        description: Minimum notional USD.
        schema:
          type: number
          minimum: 0
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page (event_ts_seq).'
        schema:
          type: string
      - name: limit
        in: query
        description: Events per page.
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
      tags:
      - Smart-money cohorts
      x-rapidapi:
        listed: false
        reason: validation accruing; RapidAPI plans are an unguarded mirror
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      x-auth: required
      x-tier: Trader (3,000 calls/day)
      operationId: get_v1_smart_money_activity
