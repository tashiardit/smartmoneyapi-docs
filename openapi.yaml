  /v1/liquidations/heatmap:
    get:
      summary: Liquidation heatmap (realized)
      description: |-
        Price x time matrix of REAL executed forced liquidations, aggregated live from five public exchange WebSocket tapes (Binance, OKX, Bybit, Bitget, BitMEX) and persisted to a local archive. Nothing here is modelled or estimated: every cell is notional that actually liquidated at that price in that minute. Public, no key.

        Windows up to 240 minutes are served from the in-process buffer (source='memory'); longer windows are read from the archive (source='archive') and additionally carry a `coverage` block.

        READ `source` AND `coverage` BEFORE DRAWING A CONCLUSION. A flat, empty band in the matrix has two completely different meanings:
        * the market was quiet (we were recording and nothing liquidated), or
        * we were not recording at all (box down, feed down) — an absence of data, not an observation of zero.

        `coverage.gaps` names the second case explicitly, and `coverage_note` summarises it in prose. `source='unavailable'` means the read itself failed, and the accompanying `note` says so — an empty payload with source='unavailable' must never be reported as 'no liquidations'.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  by_side:
                    type: object
                    properties:
                      long:
                        type: number
                      short:
                        type: number
                  clusters:
                    type: array
                    description: Price buckets ranked by liquidated notional — the practical output.
                    items:
                      type: object
                      properties:
                        price:
                          type: number
                        notional:
                          type: number
                        long_notional:
                          type: number
                        short_notional:
                          type: number
                        count:
                          type: integer
                        dominant_side:
                          type: string
                  coverage:
                    type: object
                    description: Recording coverage for the requested window. Only present when source
                      == 'archive'.
                    properties:
                      first_event_ts:
                        type: integer
                        nullable: true
                        description: Epoch ms of the oldest liquidation ever recorded, or null when the
                          archive is empty.
                      last_event_ts:
                        type: integer
                        nullable: true
                        description: Epoch ms of the newest recorded liquidation.
                      gaps:
                        type: array
                        description: Contiguous hour-runs inside the requested window with ZERO recorded
                          liquidations across every symbol and venue. That is the signature of ingest
                          being down, not of a calm market.
                        items:
                          type: object
                          properties:
                            from_ts:
                              type: integer
                            to_ts:
                              type: integer
                      error:
                        type: string
                        description: Present only when the coverage probe itself failed. Coverage is then
                          UNKNOWN — do not read its absence as full coverage.
                  coverage_note:
                    type: string
                    description: 'Present only when coverage.gaps is non-empty: prose count and total
                      hours of NOT-RECORDING inside this window.'
                  error:
                    type: string
                    description: Present when source == 'unavailable'.
                  exchanges:
                    type: object
                    description: Event count per venue BACKING THIS RESPONSE. Read it instead of assuming
                      all five tapes contributed — a venue missing here contributed nothing to this window.
                  generated_at:
                    type: integer
                  long_matrix:
                    type: array
                    description: Same grid, long liquidations only (longs force-sold).
                    items:
                      type: array
                      items:
                        type: number
                  matrix:
                    type: array
                    description: price_buckets x time_buckets of liquidated notional (USD). Long + short
                      combined.
                    items:
                      type: array
                      items:
                        type: number
                  note:
                    type: string
                    description: 'Present only when totals.count == 0, and it says WHICH zero this is:
                      a genuinely quiet window, or a failed read.'
                  price_bucket_size:
                    type: number
                  price_buckets:
                    type: integer
                  price_levels:
                    type: array
                    items:
                      type: number
                    description: Row (price) axis, low to high.
                  price_max:
                    type: number
                  price_min:
                    type: number
                  public:
                    type: boolean
                  short_matrix:
                    type: array
                    description: Same grid, short liquidations only (shorts force-bought).
                    items:
                      type: array
                      items:
                        type: number
                  source:
                    type: string
                    enum:
                    - memory
                    - archive
                    - unavailable
                    description: '''memory'' = served from the live 4h buffer. ''archive'' = read from
                      the persisted liquidation history. ''unavailable'' = the read FAILED (archive absent
                      in this process, or the query errored); the payload is a well-formed empty structure
                      and an `error` field explains the failure. Empty and broken are not the same state.'
                  symbol:
                    type: string
                  time_bucket_minutes:
                    type: integer
                    description: Width of one matrix column, derived from the window.
                  time_buckets:
                    type: array
                    items:
                      type: integer
                    description: Column (time) axis, epoch ms.
                  totals:
                    type: object
                    properties:
                      long_liq_notional:
                        type: number
                      short_liq_notional:
                        type: number
                      total_notional:
                        type: number
                      count:
                        type: integer
                  window_minutes:
                    type: integer
        '429':
          description: Rate limit exceeded
      parameters:
      - name: symbol
        in: query
        description: Base symbol, e.g. BTC.
        schema:
          type: string
          default: BTC
      - name: window_minutes
        in: query
        description: Look-back window in minutes. Default 240 (4h). Clamped to 5-129600 (90 days); out-of-range
          and unparseable values fall back to the default rather than erroring. Windows <= the live buffer
          (240m) are served from memory; anything longer is read from the liquidation archive.
        schema:
          type: integer
          default: 240
          minimum: 5
          maximum: 129600
      - name: price_buckets
        in: query
        description: Number of price rows in the matrix. Default 50, clamped to 5-100.
        schema:
          type: integer
          default: 50
          minimum: 5
          maximum: 100
      security:
      - {}
      - ApiKeyAuth: []
      x-tier: public
      tags:
      - Liquidations
      x-auth: none
      x-free-tier-symbols:
      - BTC
