          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    type: string
                  symbol:
                    type: string
                  rows:
                    type: object
                    description: 'Trade rows: exchange_ts, local_recv_ts, venue, symbol, side, price,
                      size, tape (live/replay), source.'
                  row_count:
                    type: integer
                  rows_available:
                    type: integer
