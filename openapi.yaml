  /v1/l2/trades:
    get:
      summary: L2 trade tape
      description: 'Raw trade prints for one venue over a bounded UTC hour window, read directly from
        the collector''s store (never written to). Only `venue=hyperliquid` returns rows today: every
        other venue''s API terms forbid redistribution, and the request is refused with **HTTP 403** naming
