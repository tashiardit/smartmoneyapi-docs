      description: 'The top N accounts of Hyperliquid''s leaderboard for one window (day, week, month
        or allTime), ranked by that window''s PnL. Each row carries `hl_leaderboard`: pnl, roi and vlm
        for all four windows plus account_value, exactly as Hyperliquid publishes them in its daily snapshot,
        with provenance in `snapshot` (source URL, our fetch time, Hyperliquid''s Last-Modified time of
        the file, as_of, sha256). It also carries `win_rate_stats`: closed-episode wins / closed episodes
        reconstructed from the trader''s own fills, net of fees, funding not included, with n, the window,
        coverage and the excluded episodes by reason; `state` partial_coverage (and no number, with `partial_reason`)
        when not all of the window''s fills were observed: coverage is proven, never assumed, by requiring
        the notional of the held fills to reach Hyperliquid''s own published vlm for the window (`volume_check`),
        and it fails for an account whose older fills Hyperliquid no longer serves, for older history
        the job skipped, or for fills Hyperliquid omitted. It also carries `closing_order_share` (version
        tt-closeshare-2), a second figure from the same fills, labelled "share of closing orders in profit
        — an order is counted once however many fills it executed; this is not a per-trade win rate":
        of the trader''s closing orders in the window (an order with at least one fill that reduces or
        closes a position; the unit is an order, not a fill, and one order can execute as thousands of
        fills), how many have closedPnl minus fee, summed over their closing fills, above 0, as a count
        of orders (the sample size), a share and a notional-weighted share, net of the fees of the closing
        fills only and not the opening fee, funding not included; the fill counts are secondary. It is
        not the strict win rate: a position closed by three orders counts three times, and the partial
        closes of a position that is still open count too. It is served only where the same volume proof
        holds (otherwise `state` partial_coverage and no number, with the same `partial_reason`, or `fills_missing_order_id`
        when a closing fill has no order id); a proven window with no closing order is `no_closing_orders`
        with null shares, never 0%; a snapshot processed before the metric existed, or under a different
        version of it, is `not_computed`. Hyperliquid''s own anomalies are flagged, not repaired (`hl_leaderboard_anomalies`).
        Vaults are labelled `is_vault`. Addresses on our privacy suppression list are omitted (`omitted_privacy`).
        Descriptive past performance on one venue: not a forecast, not a ranking of skill, not a recommendation
        or signal.'
