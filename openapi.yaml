                    type: object
                    description: 'States the disclosure setting this response was served under. Present
                      unless membership is published (where it is published the field is absent and the
                      cells are exact). `mode` is `withheld`: only the everyone rows (`all_observed`,
                      `all_tracked`) are served and no membership-cohort aggregate is (a week of controlled
                      cells joined in one MILP was measured to rebuild the members). `mode` is `controlled`
