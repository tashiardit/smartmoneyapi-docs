  /v1/liquidations/heatmap:
    get:
      summary: Liquidation heatmap (realized)
      description: |-
        Price x time matrix of REAL executed forced liquidations, aggregated live from five public exchange WebSocket tapes (Binance, OKX, Bybit, Bitget, BitMEX) and persisted to a local archive. Nothing here is modelled or estimated: every cell is notional that actually liquidated at that price in that minute. Public, no key.

        Windows up to 240 minutes are served from the in-process buffer (source='memory'); longer windows are read from the archive (source='archive') and additionally carry a `coverage` block.

        READ `source` AND `coverage` BEFORE DRAWING A CONCLUSION. A flat, empty band in the matrix has two completely different meanings:
        * the market was quiet (we were recording and nothing liquidated), or
        * we were not recording at all (box down, feed down) — an absence of data, not an observation of zero.

        `coverage.gaps` names the second case explicitly, and `coverage_note` summarises it in prose. `source='unavailable'` means the read itself failed, and the accompanying `note` says so — an empty payload with source='unavailable' must never be reported as 'no liquidations'.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  window_minutes:
                    type: integer
                  price_buckets:
                    type: integer
                  time_bucket_minutes:
                    type: integer
                    description: Width of one matrix column, derived from the window.
                  price_min:
                    type: number
                  price_max:
                    type: number
                  price_bucket_size:
                    type: number
                  price_levels:
                    type: array
                    items:
                      type: number
                    description: Row (price) axis, low to high.
                  time_buckets:
                    type: array
                    items:
                      type: integer
                    description: Column (time) axis, epoch ms.
                  matrix:
                    type: array
                    description: price_buckets x time_buckets of liquidated notional (USD). Long + short
                      combined.
                    items:
                      type: array
                      items:
                        type: number
                  long_matrix:
                    type: array
                    description: Same grid, long liquidations only (longs force-sold).
                    items:
                      type: array
                      items:
                        type: number
                  short_matrix:
                    type: array
                    description: Same grid, short liquidations only (shorts force-bought).
                    items:
                      type: array
                      items:
                        type: number
                  clusters:
                    type: array
                    description: Price buckets ranked by liquidated notional — the practical output.
                    items:
                      type: object
                      properties:
                        price:
                          type: number
                        notional:
                          type: number
                        long_notional:
                          type: number
                        short_notional:
                          type: number
                        count:
                          type: integer
                        dominant_side:
                          type: string
                  by_side:
                    type: object
                    properties:
                      long:
                        type: number
                      short:
                        type: number
                  totals:
                    type: object
                    properties:
                      long_liq_notional:
                        type: number
                      short_liq_notional:
                        type: number
                      total_notional:
                        type: number
                      count:
                        type: integer
                  exchanges:
                    type: object
                    description: Event count per venue BACKING THIS RESPONSE. Read it instead of assuming
                      all five tapes contributed — a venue missing here contributed nothing to this window.
                  generated_at:
                    type: integer
                  source:
                    type: string
                    enum:
                    - memory
                    - archive
                    - unavailable
                    description: '''memory'' = served from the live 4h buffer. ''archive'' = read from
                      the persisted liquidation history. ''unavailable'' = the read FAILED (archive absent
                      in this process, or the query errored); the payload is a well-formed empty structure
                      and an `error` field explains the failure. Empty and broken are not the same state.'
                  coverage:
                    type: object
                    description: Recording coverage for the requested window. Only present when source
                      == 'archive'.
                    properties:
                      first_event_ts:
                        type: integer
                        nullable: true
                        description: Epoch ms of the oldest liquidation ever recorded, or null when the
                          archive is empty.
                      last_event_ts:
                        type: integer
                        nullable: true
                        description: Epoch ms of the newest recorded liquidation.
                      gaps:
